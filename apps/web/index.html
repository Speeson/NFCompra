<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#255bd9" />
    <link rel="icon" type="image/png" href="/icons/nfcompra-logo.png" />
    <link rel="apple-touch-icon" href="/icons/nfcompra-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NFCompra</title>
    <script>
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('nfcompra.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored;
          } else {
            var legacy = localStorage.getItem('nfcompra.landing-theme');
            if (legacy === 'light' || legacy === 'dark' || legacy === 'system') preference = legacy;
          }
        } catch (e) { /* storage unavailable */ }
        var resolved = preference === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
