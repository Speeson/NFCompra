name: Deploy API

on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: boolean
        default: true
      require_latest:
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Test API
        working-directory: .
        run: npm run api:test

      - name: Typecheck API
        working-directory: .
        run: npx --workspace @nfcompra/api tsc --noEmit

      - name: Check latest branch head
        id: latest
        if: inputs.deploy && inputs.require_latest
        working-directory: .
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping API deploy because $GITHUB_SHA is no longer ${GITHUB_REF_NAME} HEAD."
          fi

      - name: Apply D1 migrations
        if: inputs.deploy && steps.latest.outputs.is_latest != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Deploy Worker
        if: inputs.deploy && steps.latest.outputs.is_latest != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Summary
        run: |
          {
            echo "## API"
            echo "- Validation: OK"
            if [ "${{ steps.latest.outputs.is_latest }}" = "false" ]; then
              echo "- Deployment: skipped, superseded push"
            elif [ "${{ inputs.deploy }}" = "true" ]; then
              echo "- Deployment: Wrangler production"
            else
              echo "- Deployment: skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
