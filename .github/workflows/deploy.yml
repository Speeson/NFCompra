name: Deploy NFCompra

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        type: choice
        default: auto
        options:
          - auto
          - everything
          - web
          - api
          - android
          - custom
      components:
        description: Custom comma-separated components, for example web,api
        required: false
        type: string
      android_release_mode:
        description: Android release behavior
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - release-dry-run
          - release
      android_version_bump:
        description: Android version bump
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: nfcompra-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
      api: ${{ steps.select.outputs.api }}
      android_build: ${{ steps.select.outputs.android_build }}
      android: ${{ steps.select.outputs.android }}
      android_release_mode: ${{ steps.select.outputs.android_release_mode }}
      android_version_bump: ${{ steps.select.outputs.android_version_bump }}
      impact_json: ${{ steps.select.outputs.impact_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MODE: ${{ github.event.inputs.mode }}
          CUSTOM_COMPONENTS: ${{ github.event.inputs.components }}
          ANDROID_RELEASE_MODE: ${{ github.event.inputs.android_release_mode }}
          ANDROID_VERSION_BUMP: ${{ github.event.inputs.android_version_bump }}
        run: |
          set -euo pipefail
          mode="${MODE:-auto}"
          release_mode="${ANDROID_RELEASE_MODE:-release}"
          version_bump="${ANDROID_VERSION_BUMP:-auto}"

          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -q '^0000000000000000000000000000000000000000$'; then
            node scripts/deploy-impact.mjs --base "$BEFORE" --head "$HEAD_SHA" --format json > impact.json
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [ -n "$base" ]; then
              node scripts/deploy-impact.mjs --base "$base" --head HEAD --format json > impact.json
            else
              node scripts/deploy-impact.mjs --format json > impact.json
            fi
          fi

          web="$(node -e "const p=require('./impact.json'); console.log(p.components.web.changed)")"
          api="$(node -e "const p=require('./impact.json'); console.log(p.components.api.changed)")"
          android_build="$(node -e "const p=require('./impact.json'); console.log(p.components.androidBuild.changed)")"
          android="$(node -e "const p=require('./impact.json'); console.log(p.components.android.changed)")"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$mode" in
              everything) web=true; api=true; android_build=true ;;
              web) web=true; api=false; android_build=false; android=false ;;
              api) web=false; api=true; android_build=false; android=false ;;
              android) web=false; api=false; android_build=true ;;
              custom)
                web=false; api=false; android_build=false; android=false
                echo "$CUSTOM_COMPONENTS" | tr ',' '\n' | while read -r component; do
                  component="$(echo "$component" | xargs)"
                  case "$component" in
                    web) echo web >> selected-components.txt ;;
                    api) echo api >> selected-components.txt ;;
                    android) echo android >> selected-components.txt ;;
                    "") ;;
                    *) echo "Unknown component: $component"; exit 1 ;;
                  esac
                done
                grep -qx web selected-components.txt 2>/dev/null && web=true || true
                grep -qx api selected-components.txt 2>/dev/null && api=true || true
                grep -qx android selected-components.txt 2>/dev/null && android_build=true || true
                ;;
            esac
            if [ "$android_build" = "true" ] && [ "$release_mode" = "release" ]; then
              android=true
            else
              android=false
            fi
          elif [ "$android_build" = "true" ] && [ "$android" != "true" ]; then
            release_mode="build-only"
          fi

          {
            echo "web=$web"
            echo "api=$api"
            echo "android_build=$android_build"
            echo "android=$android"
            echo "android_release_mode=$release_mode"
            echo "android_version_bump=$version_bump"
            echo "impact_json<<JSON"
            cat impact.json
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## NFCompra Deployment Impact"
            echo "- Web: $web"
            echo "- API: $api"
            echo "- Android build: $android_build"
            echo "- Android release: $android"
            echo "- Mode: $mode"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/deploy-web.yml
    with:
      deploy: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      deploy: true
      require_latest: ${{ github.event_name == 'push' }}
    secrets: inherit

  android:
    needs: detect
    if: needs.detect.outputs.android_build == 'true' || needs.detect.outputs.android == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-android.yml
    with:
      release_mode: ${{ needs.detect.outputs.android_release_mode }}
      version_bump: ${{ needs.detect.outputs.android_version_bump }}
    secrets: inherit
