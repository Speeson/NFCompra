name: Release Android

on:
  workflow_call:
    inputs:
      release_mode:
        required: false
        type: string
        default: build-only
      version_bump:
        required: false
        type: string
        default: auto
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: false
      ANDROID_RELEASE_KEYSTORE_PASSWORD:
        required: false
      ANDROID_RELEASE_KEY_ALIAS:
        required: false
      ANDROID_RELEASE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Validate Android
        working-directory: apps/android
        run: ./gradlew :core:database:testDebugUnitTest :core:network:testDebugUnitTest :feature:auth:testDebugUnitTest :feature:shoppinglist:testDebugUnitTest :feature:sharing:testDebugUnitTest :feature:shoppinglist:compileDebugAndroidTestKotlin :feature:sharing:compileDebugAndroidTestKotlin :app:assembleDebug

      - name: Validate changesets
        if: inputs.release_mode == 'release' || inputs.release_mode == 'release-dry-run'
        run: npm run changeset:validate

      - name: Plan Android release (dry-run)
        if: inputs.release_mode == 'release-dry-run'
        run: node scripts/android-release.mjs plan --bump "${{ inputs.version_bump }}" --format json > android-plan.json

      - name: Determine Android release target
        if: inputs.release_mode == 'release'
        id: target
        run: |
          set -euo pipefail
          node scripts/android-release.mjs plan --bump "${{ inputs.version_bump }}" --format json > android-plan.json
          CURRENT_VER="$(node -e "const p=require('./android-plan.json'); console.log(p.current.versionName)")"
          CURRENT_CODE="$(node -e "const p=require('./android-plan.json'); console.log(p.current.versionCode)")"
          PLANNED="$(node -e "const p=require('./android-plan.json'); console.log(p.nextVersionName||'')")"
          git ls-remote --tags origin 'refs/tags/v*' | awk '{print $2}' | sed 's#refs/tags/##' | sort -u | paste -sd, - > android-tags.txt
          node scripts/android-release.mjs choose-target \
            --current "$CURRENT_VER" --code "$CURRENT_CODE" \
            --planned "$PLANNED" --tags "$(cat android-tags.txt)" --format json > android-target.json
          ACTION="$(node -e "const t=require('./android-target.json'); console.log(t.action)")"
          VERSION="$(node -e "const t=require('./android-target.json'); console.log(t.versionName||'')")"
          if [ "$ACTION" = "fail" ]; then
            echo "::error::$(node -e "const t=require('./android-target.json'); console.log(t.reason)")"
            exit 1
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release target: $ACTION v$VERSION"

      - name: Prepare Android release locally (fresh)
        if: inputs.release_mode == 'release' && steps.target.outputs.action == 'fresh'
        run: |
          node scripts/android-release.mjs prepare --bump "${{ inputs.version_bump }}" --format json > android-plan.json

      - name: Checkout release source (resume)
        if: inputs.release_mode == 'release' && steps.target.outputs.action == 'resume'
        run: |
          git checkout --detach "v$ANDROID_VERSION"
          git checkout "$GITHUB_SHA" -- scripts/android-release.mjs

      - name: Validate resumed release tag
        if: inputs.release_mode == 'release' && steps.target.outputs.action == 'resume'
        run: |
          set -euo pipefail
          VERSION="$ANDROID_VERSION"
          GRADLE_VER="$(node -e "import('./scripts/android-release.mjs').then(m=>console.log(m.readAndroidVersion().versionName))")"
          GRADLE_CODE="$(node -e "import('./scripts/android-release.mjs').then(m=>console.log(m.readAndroidVersion().versionCode))")"
          META_EXISTS=false
          NOTES_EXISTS=false
          META_VER=""
          META_CODE=""
          if [ -f ".changes/releases/android-v${VERSION}.json" ]; then
            META_EXISTS=true
            META_VER="$(node -e "const m=require('./.changes/releases/android-v${VERSION}.json'); console.log(m.versionName)")"
            META_CODE="$(node -e "const m=require('./.changes/releases/android-v${VERSION}.json'); console.log(m.versionCode)")"
          fi
          if [ -f ".changes/releases/android-v${VERSION}.md" ]; then NOTES_EXISTS=true; fi
          node scripts/android-release.mjs validate-tag \
            --tag-version "$VERSION" \
            --gradle-version "$GRADLE_VER" --gradle-code "$GRADLE_CODE" \
            --metadata-exists "$META_EXISTS" \
            --metadata-version "$META_VER" --metadata-code "$META_CODE" \
            --notes-exists "$NOTES_EXISTS" --format json > android-validation.json
          OK="$(node -e "const v=require('./android-validation.json'); console.log(v.ok)")"
          if [ "$OK" != "true" ]; then
            echo "::error::Release tag v$VERSION is inconsistent and will not be resumed."
            node -e "const v=require('./android-validation.json'); for (const e of v.errors) console.log('::error:: '+e)"
            exit 1
          fi
          echo "Resumed release tag v$VERSION validated."

      - name: Read current Android version
        if: inputs.release_mode != 'release'
        run: |
          VERSION="$(node -e "import('./scripts/android-release.mjs').then(m => console.log(m.readAndroidVersion().versionName))")"
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: inputs.release_mode != 'build-only'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nfcompra-release.jks"
          echo "NFCOMPRA_KEYSTORE_FILE=$RUNNER_TEMP/nfcompra-release.jks" >> "$GITHUB_ENV"
          echo "NFCOMPRA_KEYSTORE_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NFCOMPRA_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NFCOMPRA_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        if: inputs.release_mode != 'build-only'
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease

      - name: Verify signed release APK
        if: inputs.release_mode != 'build-only'
        run: |
          set -euo pipefail
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" >/dev/null

      - name: Upload dry-run signed APK artifact
        if: inputs.release_mode == 'release-dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: NFCompra-release-dry-run-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release commit and tag (fresh)
        if: inputs.release_mode == 'release' && steps.target.outputs.action == 'fresh'
        run: |
          set -euo pipefail
          VERSION="$ANDROID_VERSION"
          if git ls-remote --exit-code --tags origin "v$VERSION"; then
            echo "::error::Tag v$VERSION already exists on origin. Re-run the release workflow to resume it instead of re-publishing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/build.gradle.kts .changes
          git commit -m "Release Android v$VERSION"
          git tag "v$VERSION"
          read -r -a PUSH_ARGS <<< "$(ANDROID_VERSION="$VERSION" node -e "import('./scripts/android-release.mjs').then(m => console.log(m.buildAtomicReleasePushArgs({ tagVersion: process.env.ANDROID_VERSION }).join(' ')))")"
          echo "Publishing release commit and tag atomically: git ${PUSH_ARGS[*]}"
          if ! git "${PUSH_ARGS[@]}"; then
            echo "::error::Atomic Android release publication failed for v$VERSION."
            echo "::error::The release commit and tag were submitted as one atomic Git update; neither was published."
            echo "::error::GitHub Release publication was not attempted."
            echo "::error::No sequential fallback is performed. Fix the remote state without forcing, then re-run the release workflow to resume."
            exit 1
          fi
          echo "Atomic publication succeeded: main and v$VERSION are published together."

      - name: Publish GitHub Release
        if: inputs.release_mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk NFCompra-release.apk
          node scripts/android-release.mjs publish-github \
            --version "$ANDROID_VERSION" \
            --title "NFCompra Android $ANDROID_VERSION" \
            --notes-path ".changes/releases/android-v$ANDROID_VERSION.md" \
            --apk-path "NFCompra-release.apk"

      - name: Summary
        run: |
          {
            echo "## Android"
            echo "- Validation: OK"
            echo "- Release mode: ${{ inputs.release_mode }}"
            echo "- Version: ${ANDROID_VERSION:-not released}"
            if [ -n "${ANDROID_ACTION:-}" ]; then
              echo "- Release action: ${ANDROID_ACTION}"
            fi
            if [ -f android-plan.json ]; then
              echo "- Release plan: calculated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
